<button type="button" class="button button-danger button-small"
    popovertarget="delete-education-{{ education.id }}">Hapus</button>

<div id="delete-education-{{ education.id }}" class="project-delete-modal" popover="auto">
    <button type="button" class="project-delete-modal__backdrop"
        popovertarget="delete-education-{{ education.id }}" popovertargetaction="hide"></button>
    <div class="project-delete-modal__content">
        <h2>Hapus Pendidikan?</h2>
        <p>Yakin mau hapus <strong>{{ education.institution }}</strong> dari riwayat pendidikan?</p>
        <div class="project-delete-modal__actions">
            <button type="button" class="button button-secondary"
                popovertarget="delete-education-{{ education.id }}" popovertargetaction="hide">Batal</button>
            <form method="post" action="{% url 'main:delete_education' education.id %}">
                {% csrf_token %}
                <button type="submit" class="button button-danger">Ya, Hapus</button>
            </form>
        </div>
    </div>
</div>
